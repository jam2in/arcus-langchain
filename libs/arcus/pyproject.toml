[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[project]
name = "langchain-arcus"
version = "0.1.0"
description = "LangChain integration for Arcus Cache"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langchain-core>=0.3,<2",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "ty==0.0.90",
]

[tool.uv.build-backend]
module-name = "langchain_arcus"
module-root = ""

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401", # BaseCache.clear() takes **kwargs: Any
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.terminal]
error-on-warning = true
